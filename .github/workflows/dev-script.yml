name: Run Dev Script

on: [push] # This workflow runs on every push to the repository

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: [actions/checkout@v4](

https://github.com
)
     
    - name: Set up Node.js
      uses: [actions/setup-node@v4](

https://github.com
)
      with:
        node-version: '20.x' # Specify your Node.js version
    - name: Install dependencies
      run: [npm ci](https://docs.npmjs.com/cli/v9/commands/npm-ci) # Use npm ci in pipelines
    - name: Run npm run dev (as a background service)
      run: |
        npm run dev &
        # Add a step here to wait for the server to start, or run tests that depend on the server
     
